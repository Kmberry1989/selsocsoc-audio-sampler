<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <title>Audio Studio</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f3f0ea;
      --panel: #fffdf8;
      --panel-2: #e9e4da;
      --ink: #1d2424;
      --muted: #5b6463;
      --line: #c8c2b7;
      --accent: #bb3d1e;
      --accent-hover: #962e16;
      --accent-ink: #fffaf5;
      --secondary: #176b68;
      --secondary-soft: #d7e9e5;
      --track: #cfc9be;
      --shadow: 0 8px 24px rgba(42, 36, 28, .09);
      --focus: #0c625f;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121616;
        --panel: #1d2322;
        --panel-2: #272e2d;
        --ink: #f5f1e8;
        --muted: #b7c0be;
        --line: #3c4644;
        --accent: #ef6845;
        --accent-hover: #ff8060;
        --accent-ink: #171010;
        --secondary: #66bbb4;
        --secondary-soft: #173c39;
        --track: #394240;
        --shadow: 0 10px 26px rgba(0, 0, 0, .22);
        --focus: #8ad7d0;
      }
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-width: 0;
      min-height: 100vh;
      background:
        linear-gradient(var(--line) 1px, transparent 1px) 0 0 / 100% 42px,
        var(--bg);
      color: var(--ink);
      font-family: "IBM Plex Sans", system-ui, sans-serif;
      line-height: 1.45;
    }
    button, input, select { font: inherit; }
    button, select, input { touch-action: manipulation; }
    button:focus-visible, select:focus-visible, input:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 3px;
    }
    .masthead {
      background: var(--ink);
      color: var(--panel);
      border-bottom: 6px solid var(--accent);
      padding: max(26px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) 26px max(20px, env(safe-area-inset-left));
    }
    .masthead-inner, main { width: min(1180px, 100%); margin: 0 auto; }
    .masthead h1 {
      margin: 0;
      font-size: clamp(2.1rem, 7vw, 4.8rem);
      line-height: .9;
      letter-spacing: -.055em;
      max-width: 820px;
    }
    .masthead p {
      margin: 14px 0 0;
      color: color-mix(in srgb, var(--panel) 78%, transparent);
      font-size: clamp(1rem, 2.2vw, 1.2rem);
      max-width: 700px;
    }
    .controls-wrap {
      position: sticky;
      top: 0;
      z-index: 10;
      padding: 12px 16px;
      background: color-mix(in srgb, var(--bg) 92%, transparent);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(10px);
    }
    .controls {
      width: min(1180px, 100%);
      margin: 0 auto;
      display: grid;
      grid-template-columns: minmax(220px, 1fr) minmax(220px, 1fr);
      gap: 18px;
      align-items: end;
    }
    .control label, .control .control-label {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 7px;
      font-size: .78rem;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    select {
      width: 100%; min-height: 48px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel);
      color: var(--ink);
      padding: 0 42px 0 13px;
    }
    .volume-row { min-height: 48px; display: flex; align-items: center; gap: 12px; }
    input[type="range"] { width: 100%; accent-color: var(--accent); }
    .value {
      min-width: 52px;
      padding: 5px 8px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: var(--panel);
      text-align: center;
      font-family: "IBM Plex Mono", monospace;
      font-size: .82rem;
    }
    main { padding: 30px 16px 72px; }
    .intro-note {
      margin: 0 0 34px;
      color: var(--muted);
    }
    .intro-note strong { color: var(--ink); margin-right: 8px; }
    .section { scroll-margin-top: 110px; margin: 0 0 46px; }
    .section-heading {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 14px;
      margin-bottom: 16px;
    }
    .section-heading h2 { margin: 0; font-size: clamp(1.35rem, 3vw, 2rem); letter-spacing: -.025em; }
    .section-rule { height: 1px; background: var(--line); }
    .section-count { color: var(--muted); font-family: "IBM Plex Mono", monospace; font-size: .78rem; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .sound-card {
      min-width: 0;
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      background: var(--panel);
      border: 1px solid var(--line);
      border-top: 4px solid var(--secondary);
      border-radius: 8px;
      box-shadow: var(--shadow);
      padding: 18px;
    }
    .sound-top { display: flex; justify-content: space-between; gap: 12px; align-items: start; }
    .sound-card h3 { margin: 0; font-size: 1.25rem; letter-spacing: -.015em; }
    .method {
      flex: none;
      border-radius: 4px;
      background: var(--panel-2);
      color: var(--muted);
      padding: 4px 7px;
      font: 500 .72rem "IBM Plex Mono", monospace;
    }
    .path {
      margin: 12px 0 16px;
      padding: 10px 11px;
      border: 1px dashed var(--line);
      border-radius: 5px;
      color: var(--muted);
      background: var(--bg);
      font: 500 .74rem/1.45 "IBM Plex Mono", monospace;
      overflow-wrap: anywhere;
    }
    .status {
      display: flex; align-items: center; gap: 8px;
      min-height: 24px;
      margin: 0 0 14px;
      color: var(--muted);
      font-size: .82rem;
    }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: none; }
    .status.loaded .status-dot { background: var(--secondary); }
    .status.loaded { color: var(--ink); }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
    .play-procedural { grid-column: 1 / -1; }
    button {
      min-height: 50px;
      border: 1px solid var(--line);
      border-radius: 5px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 12px;
      font-weight: 700;
      text-align: center;
    }
    button { color: var(--ink); background: var(--panel-2); }
    button:hover:not(:disabled) { border-color: var(--ink); }
    .play-procedural { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); font-size: 1rem; }
    .play-procedural:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
    button.is-playing { outline: 3px solid color-mix(in srgb, var(--accent) 38%, transparent); }
    .upload-control {
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 5px;
      padding: 6px 8px;
      background: transparent;
    }
    .upload-caption { display: block; margin-bottom: 3px; font-size: .68rem; font-weight: 700; }
    .file-input { display: block; width: 100%; min-height: 26px; color: var(--muted); font-size: .7rem; }
    .file-input::file-selector-button {
      min-height: 28px;
      margin-right: 7px;
      border: 0;
      border-radius: 3px;
      background: var(--panel-2);
      color: var(--ink);
      font: 700 .72rem "IBM Plex Sans", sans-serif;
      cursor: pointer;
    }
    button:disabled { cursor: not-allowed; opacity: .42; }
    .play-mine { font-size: .82rem; }
    .audio-state {
      position: fixed;
      z-index: 20;
      right: 14px;
      bottom: max(14px, env(safe-area-inset-bottom));
      max-width: min(340px, calc(100vw - 28px));
      padding: 9px 12px;
      border-radius: 5px;
      background: var(--ink);
      color: var(--panel);
      box-shadow: var(--shadow);
      font-size: .78rem;
      transform: translateY(16px);
      opacity: 0;
      pointer-events: none;
      transition: opacity .18s ease, transform .18s ease;
    }
    .audio-state.show { opacity: 1; transform: translateY(0); }
    @media (max-width: 720px) {
      .controls { grid-template-columns: 1fr; gap: 10px; }
      .control label, .control .control-label { margin-bottom: 4px; }
      .controls-wrap { padding: 10px 14px; }
      main { padding-left: 14px; padding-right: 14px; }
      .grid { grid-template-columns: 1fr; }
      .section { scroll-margin-top: 190px; }
      .intro-note { align-items: start; }
    }
    @media (max-width: 380px) {
      .actions { grid-template-columns: 1fr; }
      .play-procedural { grid-column: auto; }
      .sound-top { display: block; }
      .method { display: inline-block; margin-top: 8px; }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <header class="masthead">
    <div class="masthead-inner">
      <h1>Audio Studio</h1>
      <p>Audition every procedural sound in Selfie Social Society, then load a replacement locally for a direct A/B listen.</p>
    </div>
  </header>

  <div class="controls-wrap">
    <div class="controls">
      <div class="control">
        <label for="sound-jump"><span>Jump to file</span><span>30 slots</span></label>
        <select id="sound-jump" aria-label="Jump to a replacement file">
          <option value="">Choose an intended filename…</option>
        </select>
      </div>
      <div class="control">
        <div class="control-label"><span>Global volume</span><span>Procedural + uploads</span></div>
        <div class="volume-row">
          <input id="master-volume" type="range" min="0" max="100" value="70" aria-label="Global volume">
          <output class="value" id="volume-value" for="master-volume">70%</output>
        </div>
      </div>
    </div>
  </div>

  <main>
    <p class="intro-note"><strong>Nothing is installed yet.</strong> Each slot starts with its real procedural sound. Uploaded files stay only in this open page.</p>
    <div id="catalog"></div>
  </main>
  <div class="audio-state" id="audio-state" role="status" aria-live="polite"></div>

  <script>
/* BEGIN VERBATIM PROCEDURAL ENGINES */
class ProceduralEmoteEngine {
  constructor(contextProvider, outputGain = 0.2) {
    this.contextProvider = contextProvider;
    this.outputGain = outputGain;
    this.output = null;
    this.outputContext = null;
  }

  get ctx() {
    const context = this.contextProvider?.();
    if (!context) throw new Error("Shared AudioContext unavailable");
    if (this.outputContext !== context) {
      this.output = context.createGain();
      this.output.gain.value = this.outputGain;
      this.output.connect(context.destination);
      this.outputContext = context;
    }
    return context;
  }

  _gain(ctx, value) {
    const gain = ctx.createGain();
    gain.gain.value = value;
    gain.connect(this.output);
    return gain;
  }

  laugh() {
    const ctx = this.ctx;
    const now = ctx.currentTime;
    for (let i = 0; i < 5; i++) {
      const t = now + i * 0.13;
      const osc = ctx.createOscillator();
      const gain = this._gain(ctx, 0);
      osc.type = "sine";
      osc.frequency.setValueAtTime(280 + Math.sin(i) * 40, t);
      osc.frequency.exponentialRampToValueAtTime(190, t + 0.1);
      gain.gain.setValueAtTime(0, t);
      gain.gain.linearRampToValueAtTime(0.22, t + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
      osc.connect(gain);
      osc.start(t);
      osc.stop(t + 0.13);
    }
  }

  grunt() {
    const ctx = this.ctx;
    const now = ctx.currentTime;
    const osc = ctx.createOscillator();
    const gain = this._gain(ctx, 0);
    osc.type = "sawtooth";
    osc.frequency.setValueAtTime(110, now);
    osc.frequency.exponentialRampToValueAtTime(70, now + 0.18);
    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(0.16, now + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
    osc.connect(gain);
    osc.start(now);
    osc.stop(now + 0.22);
  }

  confusion() {
    const ctx = this.ctx;
    const now = ctx.currentTime;
    [330, 260, 310].forEach((freq, i) => {
      const t = now + i * 0.1;
      const osc = ctx.createOscillator();
      const gain = this._gain(ctx, 0);
      osc.type = "sine";
      osc.frequency.setValueAtTime(freq, t);
      osc.frequency.linearRampToValueAtTime(freq + (i === 2 ? 70 : -25), t + 0.09);
      gain.gain.setValueAtTime(0, t);
      gain.gain.linearRampToValueAtTime(0.14, t + 0.012);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
      osc.connect(gain);
      osc.start(t);
      osc.stop(t + 0.11);
    });
  }

  question() {
    const ctx = this.ctx;
    const now = ctx.currentTime;
    const osc = ctx.createOscillator();
    const gain = this._gain(ctx, 0);
    osc.type = "sine";
    osc.frequency.setValueAtTime(220, now);
    osc.frequency.exponentialRampToValueAtTime(440, now + 0.32);
    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(0.18, now + 0.03);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.36);
    osc.connect(gain);
    osc.start(now);
    osc.stop(now + 0.38);
  }

  excitement() {
    const ctx = this.ctx;
    const now = ctx.currentTime;
    [330, 440, 550].forEach((freq, i) => {
      const t = now + i * 0.085;
      const osc = ctx.createOscillator();
      const gain = this._gain(ctx, 0);
      osc.type = "triangle";
      osc.frequency.setValueAtTime(freq, t);
      gain.gain.setValueAtTime(0, t);
      gain.gain.linearRampToValueAtTime(0.16, t + 0.012);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.11);
      osc.connect(gain);
      osc.start(t);
      osc.stop(t + 0.12);
    });
  }

  cheerful() {
    const ctx = this.ctx;
    const now = ctx.currentTime;
    [294, 370, 440].forEach((freq, i) => {
      const t = now + i * 0.11;
      const osc = ctx.createOscillator();
      const gain = this._gain(ctx, 0);
      osc.type = "sine";
      osc.frequency.setValueAtTime(freq, t);
      osc.frequency.exponentialRampToValueAtTime(freq * 1.08, t + 0.1);
      gain.gain.setValueAtTime(0, t);
      gain.gain.linearRampToValueAtTime(0.15, t + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
      osc.connect(gain);
      osc.start(t);
      osc.stop(t + 0.13);
    });
  }

  talking() {
    const ctx = this.ctx;
    const now = ctx.currentTime;
    const count = 3 + Math.floor(Math.random() * 3);
    for (let i = 0; i < count; i++) {
      const t = now + i * 0.09;
      const osc = ctx.createOscillator();
      const gain = this._gain(ctx, 0);
      osc.type = "triangle";
      const base = 170 + Math.random() * 85;
      osc.frequency.setValueAtTime(base, t);
      osc.frequency.linearRampToValueAtTime(base + (Math.random() - 0.5) * 55, t + 0.08);
      gain.gain.setValueAtTime(0, t);
      gain.gain.linearRampToValueAtTime(0.11, t + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.09);
      osc.connect(gain);
      osc.start(t);
      osc.stop(t + 0.1);
    }
  }

  mumbling() {
    const ctx = this.ctx;
    const now = ctx.currentTime;
    for (let i = 0; i < 7; i++) {
      const t = now + i * 0.065;
      const osc = ctx.createOscillator();
      const gain = this._gain(ctx, 0);
      osc.type = "sine";
      osc.frequency.setValueAtTime(105 + Math.random() * 38, t);
      gain.gain.setValueAtTime(0, t);
      gain.gain.linearRampToValueAtTime(0.08, t + 0.012);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.07);
      osc.connect(gain);
      osc.start(t);
      osc.stop(t + 0.08);
    }
  }

  gasp() {
    const ctx = this.ctx;
    const now = ctx.currentTime;
    const osc = ctx.createOscillator();
    const gain = this._gain(ctx, 0);
    const filter = ctx.createBiquadFilter();
    osc.type = "sine";
    osc.frequency.setValueAtTime(180, now);
    osc.frequency.exponentialRampToValueAtTime(520, now + 0.16);
    filter.type = "bandpass";
    filter.frequency.value = 750;
    filter.Q.value = 0.8;
    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(0.2, now + 0.035);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.24);
    osc.connect(filter);
    filter.connect(gain);
    osc.start(now);
    osc.stop(now + 0.25);
  }

  sigh() {
    const ctx = this.ctx;
    const now = ctx.currentTime;
    const osc = ctx.createOscillator();
    const gain = this._gain(ctx, 0);
    const filter = ctx.createBiquadFilter();
    osc.type = "sine";
    osc.frequency.setValueAtTime(260, now);
    osc.frequency.exponentialRampToValueAtTime(105, now + 0.62);
    filter.type = "lowpass";
    filter.frequency.setValueAtTime(900, now);
    filter.frequency.exponentialRampToValueAtTime(280, now + 0.6);
    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(0.16, now + 0.06);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.66);
    osc.connect(filter);
    filter.connect(gain);
    osc.start(now);
    osc.stop(now + 0.68);
  }
}

class ProceduralAudioEngine {
  constructor(contextProvider, outputGain = 0.42) {
    this.contextProvider = contextProvider;
    this.outputGain = outputGain;
    this.output = null;
    this.outputContext = null;
  }

  get ctx() {
    const context = this.contextProvider?.();
    if (!context) throw new Error("Shared AudioContext unavailable");
    if (this.outputContext !== context) {
      this.output = context.createGain();
      this.output.gain.value = this.outputGain;
      this.output.connect(context.destination);
      this.outputContext = context;
    }
    return context;
  }

  _gain(ctx, value = 0) {
    const gain = ctx.createGain();
    gain.gain.value = value;
    gain.connect(this.output);
    return gain;
  }

  _noiseBuffer(ctx, duration) {
    const buffer = ctx.createBuffer(1, Math.max(1, Math.floor(ctx.sampleRate * duration)), ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
    return buffer;
  }

  whistle() {
    const ctx = this.ctx;
    const now = ctx.currentTime;
    const osc = ctx.createOscillator();
    const gain = this._gain(ctx, 0);
    osc.type = "sine";
    osc.frequency.setValueAtTime(1320, now);
    osc.frequency.linearRampToValueAtTime(1480, now + 0.08);
    osc.frequency.linearRampToValueAtTime(1250, now + 0.42);
    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(0.22, now + 0.02);
    gain.gain.setValueAtTime(0.18, now + 0.28);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
    osc.connect(gain);
    osc.start(now);
    osc.stop(now + 0.46);
  }

  stopwatch() {
    const ctx = this.ctx;
    const now = ctx.currentTime;
    [0, 0.22].forEach((offset) => {
      const t = now + offset;
      const osc = ctx.createOscillator();
      const gain = this._gain(ctx, 0);
      osc.type = "square";
      osc.frequency.value = 980;
      gain.gain.setValueAtTime(0.14, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.045);
      osc.connect(gain);
      osc.start(t);
      osc.stop(t + 0.05);
    });
  }

  alarm() {
    const ctx = this.ctx;
    const now = ctx.currentTime;
    for (let i = 0; i < 4; i++) {
      const t = now + i * 0.12;
      const osc = ctx.createOscillator();
      const gain = this._gain(ctx, 0);
      osc.type = "square";
      osc.frequency.value = i % 2 ? 720 : 920;
      gain.gain.setValueAtTime(0.12, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.09);
      osc.connect(gain);
      osc.start(t);
      osc.stop(t + 0.1);
    }
  }

  siren() {
    const ctx = this.ctx;
    const now = ctx.currentTime;
    const osc = ctx.createOscillator();
    const gain = this._gain(ctx, 0);
    osc.type = "sine";
    osc.frequency.setValueAtTime(430, now);
    osc.frequency.linearRampToValueAtTime(760, now + 0.45);
    osc.frequency.linearRampToValueAtTime(430, now + 0.9);
    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(0.16, now + 0.04);
    gain.gain.setValueAtTime(0.16, now + 0.78);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.94);
    osc.connect(gain);
    osc.start(now);
    osc.stop(now + 0.95);
  }

  rain() {
    const ctx = this.ctx;
    const now = ctx.currentTime;
    const source = ctx.createBufferSource();
    const filter = ctx.createBiquadFilter();
    const gain = this._gain(ctx, 0);
    source.buffer = this._noiseBuffer(ctx, 5.1);
    filter.type = "highpass";
    filter.frequency.value = 1450;
    filter.Q.value = 0.2;
    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(0.025, now + 0.7);
    gain.gain.setValueAtTime(0.025, now + 4.25);
    gain.gain.linearRampToValueAtTime(0, now + 5.05);
    source.connect(filter);
    filter.connect(gain);
    source.start(now);
    source.stop(now + 5.1);

// Cat vocals keep the supplied acoustic design, but borrow the game's one
// AudioContext and a quiet shared output so companion sounds stay subtle.
class ProceduralCatAudioEngine {
  constructor(contextProvider, outputGain = 0.16) {
    this.contextProvider = contextProvider;
    this.outputGain = outputGain;
    this.output = null;
    this.ctx = null;
  }

  init() {
    const context = this.contextProvider?.();
    if (!context) throw new Error('Shared AudioContext unavailable');
    this.ctx = context;
    if (!this.output || this.output.context !== context) {
      this.output = context.createGain();
      this.output.gain.value = this.outputGain;
      this.output.connect(context.destination);
    }
    if (context.state === 'suspended') context.resume();
    return context;
  }

  // Generate a reusable buffer of white noise
  createNoiseBuffer(duration = 1.0) {
    const bufferSize = this.ctx.sampleRate * duration;
    const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      data[i] = Math.random() * 2 - 1;
    }
    return buffer;
  }

  // 1. Standard Meow: Sawtooth vocal cord vibration through moving vowel formants
  meow() {
    const ctx = this.init();
    const now = ctx.currentTime;
    const dur = 0.75;

    // Carrier source: Rich vocal cords
    const osc = ctx.createOscillator();
    osc.type = 'sawtooth';

    // Natural pitch contour: Upward glide then descending tail
    osc.frequency.setValueAtTime(410, now);
    osc.frequency.exponentialRampToValueAtTime(680, now + 0.28);
    osc.frequency.exponentialRampToValueAtTime(430, now + dur);

    // Vocal vibrato
    const vibrato = ctx.createOscillator();
    const vibratoGain = ctx.createGain();
    vibrato.frequency.setValueAtTime(5.5, now);
    vibratoGain.gain.setValueAtTime(0, now);
    vibratoGain.gain.linearRampToValueAtTime(14, now + 0.3);
    vibrato.connect(osc.frequency);

    // Formant Filter 1 (Mouth open/close sweep: 400Hz -> 1400Hz -> 500Hz)
    const f1 = ctx.createBiquadFilter();
    f1.type = 'bandpass';
    f1.Q.value = 4.0;
    f1.frequency.setValueAtTime(420, now);
    f1.frequency.exponentialRampToValueAtTime(1350, now + 0.3);
    f1.frequency.exponentialRampToValueAtTime(520, now + dur);

    // Formant Filter 2 (Oral cavity resonance: 1600Hz -> 2500Hz -> 1400Hz)
    const f2 = ctx.createBiquadFilter();
    f2.type = 'bandpass';
    f2.Q.value = 4.5;
    f2.frequency.setValueAtTime(1500, now);
    f2.frequency.exponentialRampToValueAtTime(2450, now + 0.3);
    f2.frequency.exponentialRampToValueAtTime(1300, now + dur);

    // Amplitude envelope
    const amp = ctx.createGain();
    amp.gain.setValueAtTime(0.0001, now);
    amp.gain.linearRampToValueAtTime(0.24, now + 0.12);
    amp.gain.setValueAtTime(0.22, now + dur - 0.25);
    amp.gain.exponentialRampToValueAtTime(0.0001, now + dur);

    // Parallel formant routing
    osc.connect(f1);
    osc.connect(f2);
    f1.connect(amp);
    f2.connect(amp);
    amp.connect(this.output);

    vibrato.start(now);
    osc.start(now);
    vibrato.stop(now + dur);
    osc.stop(now + dur + 0.05);
  }

  // 2. Question ("Mrr-ow?"): Nasal flutter rolling into an ascending pitch sweep
  question() {
    const ctx = this.init();
    const now = ctx.currentTime;
    const dur = 0.52;

    const osc = ctx.createOscillator();
    osc.type = 'sawtooth';

    // Upward pitch bend (curious inflection)
    osc.frequency.setValueAtTime(360, now);
    osc.frequency.linearRampToValueAtTime(420, now + 0.14);
    osc.frequency.exponentialRampToValueAtTime(740, now + dur);

    // Fast flutter at start for the "Mrr" roll
    const flutter = ctx.createOscillator();
    const flutterGain = ctx.createGain();
    flutter.frequency.setValueAtTime(28, now);
    flutterGain.gain.setValueAtTime(28, now);
    flutterGain.gain.linearRampToValueAtTime(0.1, now + 0.2);
    flutter.connect(osc.frequency);

    // Resonant sweeping formant
    const filter = ctx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.Q.value = 3.5;
    filter.frequency.setValueAtTime(650, now);
    filter.frequency.exponentialRampToValueAtTime(1950, now + dur);

    const amp = ctx.createGain();
    amp.gain.setValueAtTime(0.0001, now);
    amp.gain.linearRampToValueAtTime(0.22, now + 0.08);
    amp.gain.setValueAtTime(0.20, now + dur - 0.1);
    amp.gain.exponentialRampToValueAtTime(0.0001, now + dur);

    osc.connect(filter);
    filter.connect(amp);
    amp.connect(this.output);

    flutter.start(now);
    osc.start(now);
    flutter.stop(now + dur);
    osc.stop(now + dur + 0.05);
  }

  // 3. Purring: 26 Hz laryngeal modulation over deep tone and filtered breath
  purr() {
    const ctx = this.init();
    const now = ctx.currentTime;
    const dur = 2.4;

    // Sub-bass vocal hum
    const sub = ctx.createOscillator();
    sub.type = 'triangle';
    sub.frequency.setValueAtTime(48, now);

    // Warm breath noise
    const noise = ctx.createBufferSource();
    noise.buffer = this.createNoiseBuffer(dur);
    const noiseFilter = ctx.createBiquadFilter();
    noiseFilter.type = 'lowpass';
    noiseFilter.frequency.setValueAtTime(260, now);

    // Glottal motor pacing (~25 Hz flutter)
    const purrLfo = ctx.createOscillator();
    purrLfo.frequency.setValueAtTime(25.5, now);
    const purrDepth = ctx.createGain();
    purrDepth.gain.setValueAtTime(0.7, now);

    // Overall breathing cycle (respiration swell)
    const respLfo = ctx.createOscillator();
    respLfo.frequency.setValueAtTime(0.55, now); // ~1.8s respiratory period
    const respGain = ctx.createGain();
    respGain.gain.setValueAtTime(0.4, now);

    // Tremolo gain node
    const tremolo = ctx.createGain();
    tremolo.gain.setValueAtTime(0.4, now);
    purrLfo.connect(tremolo.gain);

    const masterGain = ctx.createGain();
    masterGain.gain.setValueAtTime(0.0001, now);
    masterGain.gain.linearRampToValueAtTime(0.4, now + 0.3);
    masterGain.gain.setValueAtTime(0.4, now + dur - 0.4);
    masterGain.gain.exponentialRampToValueAtTime(0.0001, now + dur);

    sub.connect(tremolo);
    noise.connect(noiseFilter);
    noiseFilter.connect(tremolo);

    tremolo.connect(masterGain);
    masterGain.connect(this.output);

    purrLfo.start(now);
    respLfo.start(now);
    sub.start(now);
    noise.start(now);

    purrLfo.stop(now + dur);
    respLfo.stop(now + dur);
    sub.stop(now + dur);
    noise.stop(now + dur);
  }

  // 4. Hissing: High-pressure turbulent noise burst with dental resonance
  hiss() {
    const ctx = this.init();
    const now = ctx.currentTime;
    const dur = 0.65;

    const noise = ctx.createBufferSource();
    noise.buffer = this.createNoiseBuffer(dur);

    // High-pass to remove low body
    const hp = ctx.createBiquadFilter();
    hp.type = 'highpass';
    hp.frequency.setValueAtTime(2800, now);

    // Sharp dental oral resonance
    const bp = ctx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.setValueAtTime(5200, now);
    bp.frequency.linearRampToValueAtTime(4600, now + dur);
    bp.Q.value = 2.4;

    const amp = ctx.createGain();
    amp.gain.setValueAtTime(0.0001, now);
    amp.gain.linearRampToValueAtTime(0.35, now + 0.05); // sharp bite attack
    amp.gain.setValueAtTime(0.32, now + 0.18);
    amp.gain.exponentialRampToValueAtTime(0.0001, now + dur);

    noise.connect(hp);
    hp.connect(bp);
    bp.connect(amp);
    amp.connect(this.output);

    noise.start(now);
    noise.stop(now + dur);
  }

  // 5. Trill / Chirrup: High-speed frequency modulation over rising pitch
  trill() {
    const ctx = this.init();
    const now = ctx.currentTime;
    const dur = 0.32;

    const osc = ctx.createOscillator();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(460, now);
    osc.frequency.exponentialRampToValueAtTime(680, now + dur);

    // Fast flutter vibrato (soft palate vibration)
    const flutter = ctx.createOscillator();
    const flutterGain = ctx.createGain();
    flutter.frequency.setValueAtTime(32, now);
    flutterGain.gain.setValueAtTime(42, now);
    flutter.connect(osc.frequency);

    const filter = ctx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.setValueAtTime(1400, now);
    filter.frequency.exponentialRampToValueAtTime(2200, now + dur);
    filter.Q.value = 3.0;

    const amp = ctx.createGain();
    amp.gain.setValueAtTime(0.0001, now);
    amp.gain.linearRampToValueAtTime(0.25, now + 0.04);
    amp.gain.exponentialRampToValueAtTime(0.0001, now + dur);

    osc.connect(filter);
    filter.connect(amp);
    amp.connect(this.output);

    flutter.start(now);
    osc.start(now);
    flutter.stop(now + dur);
    osc.stop(now + dur + 0.02);
  }

  // 6. Prey Chatter: Staccato series of teeth clicks and high squeaks
  chatter() {
    const ctx = this.init();
    const now = ctx.currentTime;
    const clicks = 8;
    const spacing = 0.055;

    for (let i = 0; i < clicks; i++) {
      const t = now + (i * spacing);
      const clickDur = 0.025;

      // Tiny mouth click
      const noise = ctx.createBufferSource();
      noise.buffer = this.createNoiseBuffer(clickDur);
      const filter = ctx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.setValueAtTime(2800 + Math.random() * 400, t);
      filter.Q.value = 5.0;

      const gain = ctx.createGain();
      gain.gain.setValueAtTime(0.18, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + clickDur);

      noise.connect(filter);
      filter.connect(gain);
      gain.connect(this.output);
      noise.start(t);
      noise.stop(t + clickDur);

      // Subtle harmonic chirp transient
      const chirp = ctx.createOscillator();
      const chirpGain = ctx.createGain();
      chirp.type = 'sine';
      chirp.frequency.setValueAtTime(1400, t);
      chirp.frequency.exponentialRampToValueAtTime(950, t + clickDur);

      chirpGain.gain.setValueAtTime(0.08, t);
      chirpGain.gain.exponentialRampToValueAtTime(0.0001, t + clickDur);

      chirp.connect(chirpGain);
      chirpGain.connect(this.output);
      chirp.start(t);
      chirp.stop(t + clickDur);
    }
  }

  // 7. Warning Growl: Low rumbling throat sound with AM distortion
  growl() {
    const ctx = this.init();
    const now = ctx.currentTime;
    const dur = 1.6;

    const osc1 = ctx.createOscillator();
    const osc2 = ctx.createOscillator();
    osc1.type = 'sawtooth';
    osc2.type = 'triangle';

    osc1.frequency.setValueAtTime(118, now);
    osc1.frequency.linearRampToValueAtTime(108, now + dur);

    osc2.frequency.setValueAtTime(122, now); // Detuned beat frequency
    osc2.frequency.linearRampToValueAtTime(112, now + dur);

    // Vocal cord roughness AM
    const roughLfo = ctx.createOscillator();
    const roughGain = ctx.createGain();
    roughLfo.frequency.setValueAtTime(38, now);
    roughGain.gain.setValueAtTime(0.35, now);

    const filter = ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(450, now);

    const amp = ctx.createGain();
    amp.gain.setValueAtTime(0.0001, now);
    amp.gain.linearRampToValueAtTime(0.32, now + 0.2);
    amp.gain.setValueAtTime(0.30, now + dur - 0.3);
    amp.gain.exponentialRampToValueAtTime(0.0001, now + dur);

    osc1.connect(filter);
    osc2.connect(filter);
    filter.connect(amp);
    amp.connect(this.output);

    osc1.start(now);
    osc2.start(now);
    osc1.stop(now + dur);
    osc2.stop(now + dur);
  }

  // 8. Distressed Yowl: Caterwaul with undulating pitch and waveshaped saturation
  yowl() {
    const ctx = this.init();
    const now = ctx.currentTime;
    const dur = 1.9;

    const osc = ctx.createOscillator();
    osc.type = 'sawtooth';

    // Undulating pitch bend
    osc.frequency.setValueAtTime(380, now);
    osc.frequency.linearRampToValueAtTime(540, now + 0.45);
    osc.frequency.linearRampToValueAtTime(410, now + 0.95);
    osc.frequency.linearRampToValueAtTime(620, now + 1.45);
    osc.frequency.exponentialRampToValueAtTime(320, now + dur);

    // Wide vibrato
    const vibrato = ctx.createOscillator();
    const vibratoGain = ctx.createGain();
    vibrato.frequency.setValueAtTime(6.0, now);
    vibratoGain.gain.setValueAtTime(22, now);
    vibrato.connect(osc.frequency);

    // Throat resonance
    const filter = ctx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.Q.value = 3.2;
    filter.frequency.setValueAtTime(850, now);
    filter.frequency.linearRampToValueAtTime(1400, now + 1.2);
    filter.frequency.linearRampToValueAtTime(700, now + dur);

    const amp = ctx.createGain();
    amp.gain.setValueAtTime(0.0001, now);
    amp.gain.linearRampToValueAtTime(0.24, now + 0.2);
    amp.gain.setValueAtTime(0.24, now + dur - 0.25);
    amp.gain.exponentialRampToValueAtTime(0.0001, now + dur);

    osc.connect(filter);
    filter.connect(amp);
    amp.connect(this.output);

    vibrato.start(now);
    osc.start(now);
    vibrato.stop(now + dur);
    osc.stop(now + dur + 0.05);
  }
}

    function escapeHTML(value) {
      return String(value).replace(/[&<>'"]/g, function (char) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;" }[char];

    async function ensureAudio() {
      if (!audioCtx) {
        var AudioContextCtor = window.AudioContext || window.webkitAudioContext;

        var engine = engines[key];
        engine.outputGain = baseGains[key] * volume;
        if (engine.output && engine.output.gain) engine.output.gain.setValueAtTime(engine.outputGain, audioCtx ? audioCtx.currentTime : 0);
      });
      Object.keys(uploads).forEach(function (fileId) { uploads[fileId].audio.volume = volume; });
    }

    function flash(message) {
      var el = document.getElementById("audio-state");
      el.textContent = message;
      el.classList.add("show");
      window.clearTimeout(noticeTimer);
      noticeTimer = window.setTimeout(function () { el.classList.remove("show"); }, 1900);
    }

    function markPlaying(button) {
      document.querySelectorAll("button.is-playing").forEach(function (el) { el.classList.remove("is-playing"); });
      button.classList.add("is-playing");
      window.setTimeout(function () { button.classList.remove("is-playing"); }, 550);
    }

    renderCatalog();

    document.getElementById("sound-jump").addEventListener("change", function (event) {
      if (!event.target.value) return;
      var card = document.getElementById(event.target.value);
      if (card) {
        card.scrollIntoView({ behavior: window.matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "center" });
        card.querySelector(".play-procedural").focus({ preventScroll: true });
      }
    });

    document.getElementById("master-volume").addEventListener("input", function (event) {
      volume = Number(event.target.value) / 100;
      document.getElementById("volume-value").textContent = event.target.value + "%";
      applyVolume();
    });

    document.getElementById("catalog").addEventListener("click", async function (event) {
      var button = event.target.closest("button");
      if (!button) return;
      var card = button.closest(".sound-card");
      if (!card) return;
      var fileId = card.dataset.fileId;
      if (button.classList.contains("play-procedural")) {
        try {
          await ensureAudio();
          var engine = engines[card.dataset.engine];
          var method = card.dataset.method;
          if (!engine || typeof engine[method] !== "function") throw new Error("Sound method unavailable.");
          engine[method]();
          markPlaying(button);
          flash("Playing procedural: " + fileId);
        } catch (error) {
          flash(error.message || "This sound could not play.");
        }
      }
      if (button.classList.contains("play-mine")) {
        var item = uploads[fileId];
        if (!item) return;
        if (activeUpload && activeUpload !== item.audio) { activeUpload.pause(); activeUpload.currentTime = 0; }
        item.audio.currentTime = 0;
        item.audio.volume = volume;
        try {
          await item.audio.play();
          activeUpload = item.audio;
          markPlaying(button);
          flash("Playing upload: " + item.file.name);
        } catch (error) {
          flash("The uploaded audio could not play.");
        }
      }
    });

    document.getElementById("catalog").addEventListener("change", function (event) {
      if (!event.target.matches('input[type="file"]')) return;
      var card = event.target.closest(".sound-card");
      var file = event.target.files && event.target.files[0];
      if (!card || !file) return;
      var fileId = card.dataset.fileId;
      if (uploads[fileId]) URL.revokeObjectURL(uploads[fileId].url);
      var url = URL.createObjectURL(file);
      var audio = new Audio(url);
      audio.preload = "metadata";
      audio.volume = volume;
      uploads[fileId] = { file: file, url: url, audio: audio };
      card.querySelector(".play-mine").disabled = false;
      var status = card.querySelector(".status");
      status.classList.add("loaded");
      var expected = fileId + ".mp3";
      var differs = file.name.toLowerCase() !== expected.toLowerCase();
      status.querySelector(".status-text").textContent = "Loaded: " + file.name + (differs ? " (filename differs)" : "");
      flash("Replacement loaded for " + fileId);
    });

    window.addEventListener("beforeunload", function () {
      Object.keys(uploads).forEach(function (fileId) { URL.revokeObjectURL(uploads[fileId].url); });
    });
  </script>
</body>
</html>
